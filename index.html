<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovancy — Feira Tecnológica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0d0a1f;
    --bg-2:#1a1233;
    --violet:#a855f7;
    --violet-deep:#5800aa;
    --violet-light:#d8b4fe;
    --blue:#5b8cff;
    --surface:rgba(255,255,255,0.055);
    --surface-hover:rgba(255,255,255,0.10);
    --border:rgba(216,180,254,0.18);
    --text:#f5f3ff;
    --muted:#c3b6e8;
    --glow:rgba(168,85,247,0.45);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    min-height:100%;
    background:
      radial-gradient(700px 500px at 15% -5%, var(--glow), transparent 60%),
      radial-gradient(600px 500px at 90% 15%, rgba(105, 2, 201, 0.35), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  /* Padrão de circuito sutil no fundo */
  .circuit-bg{
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(27, 27, 27, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(19, 19, 19, 0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, black 40%, transparent 90%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:460px;
    margin:0 auto;
    padding:56px 22px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .badge{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--border);
    padding:6px 14px;
    border-radius:999px;
    background:var(--surface);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .badge .dot{
    width:6px; height:6px; border-radius:50%;
    background:linear-gradient(90deg, var(--violet-deep), var(--violet-light));
    box-shadow:0 0 8px var(--glow);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(0.75); }
  }

  /* Logo grande, sem moldura quadrada - é a wordmark inteira */
  .logo{
    margin-top:30px;
    width:100%;
    max-width:300px;
    display:flex;
    justify-content:center;
  }
  .logo img{
    width:100%;
    height:auto;
    object-fit:contain;
    filter:drop-shadow(0 6px 24px rgba(144, 101, 247, 0.35));
  }

  .subtitle{
    margin-top:22px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15.5px;
    text-align:center;
    background:linear-gradient(90deg, var(--violet-deep), var(--violet-light));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .context{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
    line-height:1.5;
  }
  .context b{ color:var(--text); font-weight:600; }

  .links{
    width:100%;
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(10px);
    text-decoration:none;
    color:var(--text);
    position:relative;
    overflow:hidden;
    transition:transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .link-card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(176, 99, 248, 0.2), rgba(120, 1, 231, 0.16));
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px);
    background:var(--surface-hover);
    border-color:rgba(216,180,254,0.5);
    outline:none;
  }
  .link-card:hover::before, .link-card:focus-visible::before{ opacity:1; }
  .link-card:active{ transform:translateY(0px) scale(0.99); }

  .icon-box{
    flex-shrink:0;
    width:42px; height:42px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--violet), var(--violet-deep));
    position:relative; z-index:1;
  }
  .icon-box svg{ width:20px; height:20px; stroke:white; }

  .link-text{ position:relative; z-index:1; flex:1; }
  .link-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15.5px; }
  .link-desc{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  .arrow{ position:relative; z-index:1; color:var(--muted); flex-shrink:0; transition:transform 0.18s ease; }
  .link-card:hover .arrow{ transform:translateX(3px); color:var(--text); }

  footer{
    margin-top:44px;
    text-align:center;
  }
  footer .tagline{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
  footer .tagline b{
    background:linear-gradient(90deg, var(--violet-deep), var(--violet-light));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  @media (max-width:380px){
    .logo{ max-width:230px; }
    .wrap{ padding:44px 16px 32px; }
  }
</style>
</head>
<body>

<div class="circuit-bg"></div>

<div class="wrap">

  <div class="badge"><span class="dot"></span> JORNADA TECNOLÓGICA </div>

  <div class="logo">
    <img src="logo.png" alt="Renovancy">
  </div>

  <div class="subtitle">Engenharia Social &amp; Cibersegurança</div>
 

  <div class="links">

    <a class="link-card" href="https://instagram.com/renovancy_/" target="_blank" rel="noopener">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="link-text">
        <div class="link-title">Time do TCC</div>
        <div class="link-desc">@renovancy_ no Instagram</div>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a class="link-card" href="Engenharia social e Cibersegurança Time 8.pdf" target="_blank" rel="noopener" data-link="conteudo-feira">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="link-text">
        <div class="link-title">Conteúdo da Feira</div>
        <div class="link-desc">Material sobre phishing, smishing e deepfakes</div>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a class="link-card" href="Engenharia social e cybersegurança Slides.pdf" target="_blank" rel="noopener" data-link="slides">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </div>
      <div class="link-text">
        <div class="link-title">Slides da Apresentação</div>
        <div class="link-desc">Engenharia Social e Cibersegurança</div>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>

  </div>

  <footer>
    <div class="tagline">Renovancy  — 2026</div>
  </footer>

</div>

</body>
</html>
