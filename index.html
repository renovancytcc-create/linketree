<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Renovancy — Linktree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --violet:#6d12c4;
    --violet-deep:#5800aa;
    --violet-light:#8a3fd6;
    --blue:#5b8cff;
    --surface:rgba(255,255,255,0.65);
    --surface-hover:rgba(255,255,255,0.9);
    --border:rgba(88,0,170,0.22);
    --text:#1c1030;
    --muted:#5d4a7a;
    --glow:rgba(88,0,170,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    min-height:100%;
    background-color:#efe3fb;
    background-image:
      radial-gradient(900px 420px at 50% -8%, rgba(88,0,170,0.18), transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #f6eefd 45%, #e4d0f7 100%);
    background-repeat:no-repeat;
  }
  body{
    min-height:100vh;
    background:transparent;
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }
  .circuit-bg{
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(88,0,170,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,0,170,0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, black 40%, transparent 90%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative; z-index:2; max-width:460px; margin:0 auto;
    padding:56px 22px 40px;
    display:flex; flex-direction:column; align-items:center;
  }
  .badge{
    font-family:'Space Grotesk', sans-serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--muted);
    border:1px solid var(--border); padding:6px 14px; border-radius:999px;
    background:var(--surface); display:flex; align-items:center; gap:8px;
  }
  .badge .dot{
    width:6px; height:6px; border-radius:50%;
    background:linear-gradient(90deg, var(--violet-deep), var(--violet-light));
    box-shadow:0 0 8px var(--glow);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:0.4; transform:scale(0.75);} }
  .logo{
    margin-top:34px; width:100%; max-width:380px; display:flex; justify-content:center;
    position:relative; padding:10px 8px;
  }
  .logo::before{
    content:""; position:absolute; inset:2px;
    background:radial-gradient(ellipse 75% 70% at 50% 50%, rgba(168,85,247,0.14), rgba(168,85,247,0.06) 55%, transparent 78%);
    filter:blur(4px); z-index:0; border-radius:28px;
  }
  .logo img{
    width:100%; height:auto; object-fit:contain; position:relative; z-index:1;
    filter:drop-shadow(0 6px 20px rgba(88,0,170,0.22));
  }
  .links{ width:100%; margin-top:36px; display:flex; flex-direction:column; gap:14px; }
  .link-card{
    display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px;
    border-radius:16px; background:var(--surface); border:1px solid var(--border);
    backdrop-filter:blur(10px); text-decoration:none; color:var(--text);
    position:relative; overflow:hidden;
    transition:transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
  }
  .link-card::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(88,0,170,0.08), rgba(88,0,170,0.04));
    opacity:0; transition:opacity 0.2s ease;
  }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px); background:var(--surface-hover);
    border-color:rgba(88,0,170,0.5); outline:none;
  }
  .link-card:hover::before, .link-card:focus-visible::before{ opacity:1; }
  .link-card:active{ transform:translateY(0px) scale(0.99); }
  .icon-box{
    flex-shrink:0; width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--violet), var(--violet-deep));
    position:relative; z-index:1;
  }
  .icon-box svg{ width:20px; height:20px; stroke:white; }
  .link-text{ position:relative; z-index:1; flex:1; }
  .link-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15.5px; }
  .link-desc{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .arrow{ position:relative; z-index:1; color:var(--muted); flex-shrink:0; transition:transform 0.18s ease; }
  .link-card:hover .arrow{ transform:translateX(3px); color:var(--violet-deep); }
  footer{ margin-top:44px; text-align:center; }
  footer .tagline{ font-size:12px; color:var(--muted); letter-spacing:0.04em; }
  @media (max-width:380px){
    .logo{ max-width:280px; }
    .wrap{ padding:44px 16px 32px; }
  }
</style>
</head>
<body>
<div class="circuit-bg"></div>
<div class="wrap">
  <div class="badge"><span class="dot"></span> TCC </div>
  <div class="logo"><img src="logo.png" alt="Renovancy"></div>
  <div class="links">
    <a class="link-card" href="https://instagram.com/renovancy_/" target="_blank" rel="noopener">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="link-text"><div class="link-title">Time Renovancy</div><div class="link-desc">@renovancy_ no Instagram</div></div>
      <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="link-card" href="https://renovancytcc-create.github.io/renovancy/" target="_blank" rel="noopener">
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="link-text"><div class="link-title">Site Renovancy</div><div class="link-desc">Descubra mais sobre nós</div></div>
      <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>
  <footer><div class="tagline">Renovancy — 2026</div></footer>
</div>
</body>
</html>
